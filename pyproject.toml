[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharedcap-afa"
version = "0.1.0"
description = "Statistical evaluation of capacity-constrained laboratory test allocation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
